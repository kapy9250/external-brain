<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Brain</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007aff'/%3E%3Cpath d='M16 20h32v6H16zm0 12h22v6H16zm0 12h32v6H16z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script>
    // Remote TTS endpoint (ElevenLabs via Cloudflare Worker)
    window.TTS_API_ENDPOINT = "https://external-brain-tts.filda.workers.dev/tts";
    window.OPENAI_TTS_VOICE = "alloy";
  </script>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --text-muted: #666666;
      --primary-color: #007aff;
      --border-radius: 12px;
      --tts-highlight: rgba(255, 230, 90, 0.5);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1c1c1e;
        --card-bg: #2c2c2e;
        --text-color: #f5f5f7;
        --text-muted: #ebebf5;
        --tts-highlight: rgba(255, 196, 0, 0.35);
      }
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto 30px;
    }
    .header h1 { margin: 0; font-size: 28px; }

    .lang-switch {
      display: flex;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .lang-btn {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-weight: bold;
      transition: background 0.3s;
    }
    .lang-btn.active { background: var(--primary-color); color: #fff; }

    .masonry {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card-title {
      font-size: 20px;
      margin: 0 0 8px 0;
      cursor: pointer;
      color: var(--primary-color);
    }
    .card-title:hover { text-decoration: underline; }
    .card-summary { color: var(--text-muted); font-size: 15px; margin: 0; }
    .card-content {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(128,128,128,0.2);
      font-size: 16px;
      overflow-x: auto;
    }
    .card-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 10px 0;
    }
    .card-content pre {
      background: rgba(128,128,128,0.1);
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card-content blockquote {
      border-left: 4px solid var(--primary-color);
      margin: 0;
      padding-left: 15px;
      color: var(--text-muted);
    }

    .tts-sentence {
      border-radius: 4px;
      transition: background-color 0.2s;
      cursor: pointer;
    }
    .tts-sentence.active {
      background: var(--tts-highlight);
    }

    .floating-menu {
      position: fixed;
      right: 16px;
      bottom: 24px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }
    .floating-menu.show { display: flex; }
    .floating-btn {
      border: 1px solid rgba(127,127,127,.28);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      padding: 0;
      background: var(--card-bg);
      color: var(--text-color);
      box-shadow: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .floating-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .floating-btn.active {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    .floating-btn i { font-size: 18px; line-height: 1; }

    .sleep-panel {
      position: fixed;
      right: 64px;
      bottom: 78px;
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 8px;
      width: 190px;
      background: var(--card-bg);
      border: 1px solid rgba(127,127,127,.28);
      border-radius: 10px;
      z-index: 1000;
    }
    .sleep-panel.show { display: grid; }
    .sleep-opt {
      border: 1px solid rgba(127,127,127,.28);
      border-radius: 8px;
      background: transparent;
      color: var(--text-color);
      font-size: 12px;
      padding: 6px 0;
      cursor: pointer;
    }
    .sleep-opt.danger { color: #d14343; }

    .loader {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>External Brain</h1>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <div class="masonry" id="masonry"></div>
  <div class="loader" id="loader">Loading more...</div>

  <div id="floatingMenu" class="floating-menu" aria-label="阅读悬浮菜单">
    <button id="btnPlayPause" class="floating-btn" aria-label="播放或暂停" title="播放/暂停"><i class="bi bi-play-fill"></i></button>
    <button id="btnSleep" class="floating-btn" aria-label="定时关闭" title="定时关闭"><i class="bi bi-stopwatch"></i></button>
    <button id="btnShare" class="floating-btn" aria-label="分享当前文章" title="分享当前文章"><i class="bi bi-share"></i></button>
    <button id="btnPrev" class="floating-btn" aria-label="上一篇" title="上一篇"><i class="bi bi-chevron-up"></i></button>
    <button id="btnNext" class="floating-btn" aria-label="下一篇" title="下一篇"><i class="bi bi-chevron-down"></i></button>
    <button id="btnTop" class="floating-btn" aria-label="返回顶部" title="返回顶部"><i class="bi bi-arrow-up"></i></button>
  </div>

  <div id="sleepPanel" class="sleep-panel" aria-label="定时关闭面板">
    <button class="sleep-opt" data-min="5">5m</button>
    <button class="sleep-opt" data-min="10">10m</button>
    <button class="sleep-opt" data-min="15">15m</button>
    <button class="sleep-opt" data-min="20">20m</button>
    <button class="sleep-opt" data-min="30">30m</button>
    <button class="sleep-opt" data-min="45">45m</button>
    <button class="sleep-opt" data-min="60">60m</button>
    <button class="sleep-opt danger" data-min="0">Off</button>
  </div>

  <script>
    let currentLang = 'zh';
    let articles = [];
    let page = 0;
    const pageSize = 10;
    let expandedId = null;

    const masonry = document.getElementById('masonry');
    const loader = document.getElementById('loader');
    const floatingMenu = document.getElementById('floatingMenu');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnSleep = document.getElementById('btnSleep');
    const btnShare = document.getElementById('btnShare');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnTop = document.getElementById('btnTop');
    const sleepPanel = document.getElementById('sleepPanel');

    const TTS_API_ENDPOINT = window.TTS_API_ENDPOINT || '';
    const OPENAI_TTS_VOICE = window.OPENAI_TTS_VOICE || 'alloy';
    const TTS_PLAYBACK_RATE = 1.25;
    // 默认优先 remote(OpenAI Worker)，失败后自动回退 webspeech
    let activeTtsMode = TTS_API_ENDPOINT ? 'remote' : 'webspeech';

    const ttsState = {
      articleId: null,
      sentences: [],
      currentIndex: 0,
      isPaused: false,
      isPlaying: false,
      utterance: null,
      audioEl: null,
      bufferMap: new Map(),   // index -> remoteAudio payload
      inflightMap: new Map(), // index -> Promise
      prefetchAheadCount: 3,
      sessionToken: 0
    };

    const sleepState = {
      timerId: null,
      endAt: null,
      minutes: 0
    };

    function isPlaybackActive(token) {
      return ttsState.isPlaying && !ttsState.isPaused && expandedId === ttsState.articleId && token === ttsState.sessionToken;
    }

    function clearSleepTimer() {
      if (sleepState.timerId) {
        clearTimeout(sleepState.timerId);
        sleepState.timerId = null;
      }
      sleepState.endAt = null;
      sleepState.minutes = 0;
      btnSleep?.classList.remove('active');
      btnSleep.title = '定时关闭';
      btnSleep.innerHTML = '<i class="bi bi-stopwatch"></i>';
      sleepPanel?.classList.remove('show');
    }

    function setSleepTimer(minutes) {
      clearSleepTimer();
      if (!minutes || minutes <= 0) return;
      sleepState.minutes = minutes;
      sleepState.endAt = Date.now() + minutes * 60 * 1000;
      sleepState.timerId = setTimeout(() => {
        stopTTS();
        clearSleepTimer();
      }, minutes * 60 * 1000);
      btnSleep?.classList.add('active');
      btnSleep.title = `定时关闭 ${minutes} 分钟`;
      btnSleep.innerHTML = '<i class="bi bi-stopwatch-fill"></i>';
    }

    async function init() {
      try {
        const res = await fetch('./articles.json');
        articles = await res.json();
        renderNextPage();
        setupObserver();
        setupFloatingMenuActions();
        await openFromDeepLink();
      } catch (e) {
        loader.innerText = 'Failed to load articles.';
      }
    }

    function renderNextPage() {
      const start = page * pageSize;
      const end = start + pageSize;
      const slice = articles.slice(start, end);

      if (slice.length === 0) {
        loader.innerText = 'No more articles.';
        return;
      }

      slice.forEach(article => {
        const data = article[currentLang];
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${article.id}`;
        card.dataset.id = article.id;

        card.innerHTML = `
          <h2 class="card-title" onclick="toggleCard(${article.id})">${data.title}</h2>
          <p class="card-summary">${data.summary}</p>
          <div class="card-content" id="content-${article.id}"></div>
        `;
        masonry.appendChild(card);
      });

      page++;
      if (page * pageSize >= articles.length) loader.innerText = 'All loaded.';
    }

    function getArticleIndexById(id) {
      return articles.findIndex(a => a.id === id);
    }

    function buildShareUrl(id) {
      const article = articles.find(a => a.id === id);
      if (!article) {
        const fallback = new URL(window.location.href);
        fallback.searchParams.set('article', String(id));
        return fallback.toString();
      }

      const base = `${window.location.origin}/p/${article.id}_${article.slug}.html`;
      const url = new URL(base);
      url.searchParams.set('lang', currentLang);
      return url.toString();
    }

    function syncUrlForArticle(id) {
      const url = new URL(window.location.href);
      if (id === null || id === undefined) {
        url.searchParams.delete('article');
      } else {
        url.searchParams.set('article', String(id));
      }
      history.replaceState({}, '', url.toString());
    }

    async function openFromDeepLink() {
      const url = new URL(window.location.href);
      const articleParam = url.searchParams.get('article');
      if (!articleParam) return;
      const id = Number(articleParam);
      if (!Number.isFinite(id)) return;
      const idx = getArticleIndexById(id);
      if (idx < 0) return;
      await ensureRenderedByIndex(idx);
      await openCard(id);
    }

    async function ensureRenderedByIndex(index) {
      while (index >= page * pageSize && page * pageSize < articles.length) {
        renderNextPage();
      }
    }

    function updateFloatingMenuVisibility() {
      if (expandedId === null) {
        floatingMenu.classList.remove('show');
        return;
      }
      floatingMenu.classList.add('show');
      const idx = getArticleIndexById(expandedId);
      btnPrev.disabled = idx <= 0;
      btnNext.disabled = idx >= articles.length - 1;
      btnPlayPause.innerHTML = ttsState.isPlaying && !ttsState.isPaused
        ? '<i class="bi bi-pause-fill"></i>'
        : '<i class="bi bi-play-fill"></i>';
    }

    function stopTTS() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (ttsState.audioEl) {
        ttsState.audioEl.pause();
        ttsState.audioEl.src = '';
        ttsState.audioEl = null;
      }
      ttsState.sessionToken += 1;
      ttsState.articleId = null;
      ttsState.sentences = [];
      ttsState.currentIndex = 0;
      ttsState.isPaused = false;
      ttsState.isPlaying = false;
      ttsState.utterance = null;
      ttsState.bufferMap.clear();
      ttsState.inflightMap.clear();
      clearSleepTimer();
      clearSentenceHighlight();
      updateFloatingMenuVisibility();
    }

    function clearSentenceHighlight() {
      document.querySelectorAll('.tts-sentence.active').forEach(el => el.classList.remove('active'));
    }

    function highlightCurrentSentence() {
      clearSentenceHighlight();
      const span = ttsState.sentences[ttsState.currentIndex];
      if (!span) return;
      span.classList.add('active');
      span.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function splitToSentences(text) {
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];
      const parts = cleaned.match(/[^。！？!?\.]+[。！？!?\.]?|[^。！？!?\.]+$/g) || [];
      return parts.map(s => s.trim()).filter(Boolean);
    }

    function wrapTextNodeWithSentenceSpans(textNode) {
      const text = textNode.nodeValue;
      if (!text || !text.trim()) return;
      const sentences = splitToSentences(text);
      if (!sentences.length) return;

      const frag = document.createDocumentFragment();
      sentences.forEach((s, idx) => {
        const span = document.createElement('span');
        span.className = 'tts-sentence';
        span.textContent = s + (idx === sentences.length - 1 ? '' : ' ');
        frag.appendChild(span);
      });
      textNode.parentNode.replaceChild(frag, textNode);
    }

    function prepareReadableSentences(contentDiv) {
      const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const parent = node.parentNode;
          if (!parent) return NodeFilter.FILTER_REJECT;
          const tag = parent.tagName;
          if (['SCRIPT', 'STYLE', 'PRE', 'CODE'].includes(tag)) return NodeFilter.FILTER_REJECT;
          if (parent.closest('pre,code')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(wrapTextNodeWithSentenceSpans);

      contentDiv.querySelectorAll('.tts-sentence').forEach((span, idx) => {
        span.dataset.sentenceIndex = idx;
        span.addEventListener('dblclick', async () => {
          if (expandedId === null) return;
          await startTTS(expandedId, idx);
        });
      });
    }

    async function openCard(id) {
      const targetCard = document.getElementById(`card-${id}`);
      const contentDiv = document.getElementById(`content-${id}`);
      if (!targetCard || !contentDiv) return;

      if (expandedId !== null && expandedId !== id) {
        const prevDiv = document.getElementById(`content-${expandedId}`);
        if (prevDiv) prevDiv.style.display = 'none';
        stopTTS();
      }

      contentDiv.style.display = 'block';
      expandedId = id;
      syncUrlForArticle(id);
      await loadArticleContent(id);
      updateFloatingMenuVisibility();

      setTimeout(() => {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

    function closeCard(id) {
      const contentDiv = document.getElementById(`content-${id}`);
      if (contentDiv) contentDiv.style.display = 'none';
      if (expandedId === id) expandedId = null;
      syncUrlForArticle(null);
      stopTTS();
      updateFloatingMenuVisibility();
    }

    async function toggleCard(id) {
      const contentDiv = document.getElementById(`content-${id}`);
      if (!contentDiv) return;
      const isExpanded = contentDiv.style.display === 'block';
      if (isExpanded) {
        closeCard(id);
      } else {
        await openCard(id);
      }
    }

    async function loadArticleContent(id) {
      const contentDiv = document.getElementById(`content-${id}`);
      const article = articles.find(a => a.id === id);
      const fileUrl = article[currentLang].file;

      if (!contentDiv.dataset.loadedLang || contentDiv.dataset.loadedLang !== currentLang) {
        contentDiv.innerHTML = '<p>Loading...</p>';
        try {
          const res = await fetch(`./${fileUrl}`);
          if (!res.ok) throw new Error('Network response was not ok');
          const md = await res.text();
          contentDiv.innerHTML = marked.parse(md);
          prepareReadableSentences(contentDiv);
          contentDiv.dataset.loadedLang = currentLang;
        } catch (e) {
          contentDiv.innerHTML = '<p>Error loading content.</p>';
        }
      }
    }

    function getBestVoiceForLang(lang) {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;

      const lower = (s) => (s || '').toLowerCase();
      const isZh = (v) => lower(v.lang).includes('zh');

      if (lang === 'zh') {
        const zhVoices = voices.filter(isZh);
        if (!zhVoices.length) return voices[0] || null;

        // iOS / Apple preferred ordering
        const siriZh = zhVoices.find(v => lower(v.name).includes('siri'));
        if (siriZh) return siriZh;

        const tingTing = zhVoices.find(v => {
          const n = lower(v.name);
          return n.includes('ting-ting') || n.includes('tingting');
        });
        if (tingTing) return tingTing;

        // Prefer enhanced/premium/neural hints if available
        const premiumZh = zhVoices.find(v => {
          const n = lower(v.name);
          return n.includes('enhanced') || n.includes('premium') || n.includes('neural');
        });
        if (premiumZh) return premiumZh;

        return zhVoices[0];
      }

      return voices.find(v => lower(v.lang).includes('en')) || voices[0] || null;
    }

    async function fetchRemoteSentenceAudio(text) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000); // 12s hard timeout

      try {
        const res = await fetch(TTS_API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            text,
            lang: currentLang,
            provider: 'openai',
            voice_id: OPENAI_TTS_VOICE,
            format: 'mp3'
          })
        });

        if (!res.ok) {
          throw new Error(`TTS API failed: ${res.status}`);
        }

        const data = await res.json();
        if (!data.audio_url && !data.audio_base64) {
          throw new Error('TTS API response missing audio data');
        }
        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function ensureRemoteAudioForIndex(index) {
      if (ttsState.bufferMap.has(index)) {
        return ttsState.bufferMap.get(index);
      }

      if (ttsState.inflightMap.has(index)) {
        return await ttsState.inflightMap.get(index);
      }

      const span = ttsState.sentences[index];
      if (!span) return null;
      const text = span.textContent.trim();
      if (!text) return null;

      const p = fetchRemoteSentenceAudio(text)
        .then((audio) => {
          ttsState.bufferMap.set(index, audio);
          return audio;
        })
        .finally(() => {
          ttsState.inflightMap.delete(index);
        });

      ttsState.inflightMap.set(index, p);
      return await p;
    }

    function prefetchRemoteAhead(fromIndex) {
      if (activeTtsMode !== 'remote') return;
      const end = Math.min(ttsState.sentences.length - 1, fromIndex + ttsState.prefetchAheadCount);
      for (let i = fromIndex; i <= end; i++) {
        if (i < 0) continue;
        if (ttsState.bufferMap.has(i) || ttsState.inflightMap.has(i)) continue;
        // fire and forget
        ensureRemoteAudioForIndex(i).catch(() => {});
      }
    }

    function speakCurrentSentenceWebSpeech() {
      if (!ttsState.sentences.length || ttsState.currentIndex >= ttsState.sentences.length) {
        stopTTS();
        return;
      }

      const span = ttsState.sentences[ttsState.currentIndex];
      const text = span.textContent.trim();
      if (!text) {
        ttsState.currentIndex += 1;
        speakCurrentSentenceWebSpeech();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = currentLang === 'zh' ? 'zh-CN' : 'en-US';
      const voice = getBestVoiceForLang(currentLang);
      if (voice) utterance.voice = voice;
      utterance.rate = TTS_PLAYBACK_RATE;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        ttsState.isPlaying = true;
        ttsState.isPaused = false;
        highlightCurrentSentence();
        updateFloatingMenuVisibility();
      };

      utterance.onend = () => {
        ttsState.currentIndex += 1;
        speakCurrentSentenceWebSpeech();
      };

      utterance.onerror = () => {
        ttsState.currentIndex += 1;
        speakCurrentSentenceWebSpeech();
      };

      ttsState.utterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    async function speakCurrentSentenceRemote() {
      const token = ttsState.sessionToken;
      if (!isPlaybackActive(token)) return;
      if (!ttsState.sentences.length || ttsState.currentIndex >= ttsState.sentences.length) {
        stopTTS();
        return;
      }

      const span = ttsState.sentences[ttsState.currentIndex];
      const text = span.textContent.trim();
      if (!text) {
        ttsState.currentIndex += 1;
        await speakCurrentSentenceRemote();
        return;
      }

      try {
        ttsState.isPlaying = true;
        ttsState.isPaused = false;
        highlightCurrentSentence();
        updateFloatingMenuVisibility();

        // 当前句优先从缓冲取，没有则即时取
        const remoteAudio = await ensureRemoteAudioForIndex(ttsState.currentIndex);
        // 同时预取后续几句，减少句间停顿
        prefetchRemoteAhead(ttsState.currentIndex + 1);

        let retryCount = 0;
        const maxRetries = 5; // handle KV eventual consistency
        let safetyTimer = null;

        const playRemoteAudio = async () => {
          if (!remoteAudio) {
            // 空句或取音频失败，跳下一句
            ttsState.currentIndex += 1;
            await speakCurrentSentenceRemote();
            return;
          }

          const src = remoteAudio.audio_base64
            ? `data:audio/mpeg;base64,${remoteAudio.audio_base64}`
            : remoteAudio.audio_url;

          const audio = new Audio(src);
          audio.preload = 'auto';
          audio.playbackRate = TTS_PLAYBACK_RATE;
          ttsState.audioEl = audio;

          const clearSafety = () => {
            if (safetyTimer) {
              clearTimeout(safetyTimer);
              safetyTimer = null;
            }
          };

          audio.onended = async () => {
            clearSafety();
            if (!isPlaybackActive(token)) return;
            ttsState.currentIndex += 1;
            await speakCurrentSentenceRemote();
          };

          audio.onerror = async () => {
            clearSafety();
            if (!isPlaybackActive(token)) return;
            if (retryCount < maxRetries) {
              retryCount += 1;
              setTimeout(() => {
                if (isPlaybackActive(token)) playRemoteAudio();
              }, 500 * retryCount);
              return;
            }
            // remote 失败：自动回退本地，并从当前句继续
            activeTtsMode = 'webspeech';
            speakCurrentSentence();
          };

          // 防卡死保护：单句超过 25 秒自动回退本地
          safetyTimer = setTimeout(() => {
            if (!isPlaybackActive(token)) return;
            try { audio.pause(); } catch {}
            if (retryCount < maxRetries) {
              retryCount += 1;
              setTimeout(() => {
                if (isPlaybackActive(token)) playRemoteAudio();
              }, 500 * retryCount);
              return;
            }
            activeTtsMode = 'webspeech';
            speakCurrentSentence();
          }, 25000);

          await audio.play();
        };

        await playRemoteAudio();
      } catch (err) {
        console.error(err);
        if (!isPlaybackActive(token)) return;
        // remote 失败：自动回退本地，并从当前句继续
        activeTtsMode = 'webspeech';
        speakCurrentSentence();
      }
    }

    function speakCurrentSentence() {
      if (activeTtsMode === 'remote') {
        speakCurrentSentenceRemote();
      } else {
        speakCurrentSentenceWebSpeech();
      }
    }

    async function startTTS(articleId, startIndex = 0) {
      if (!('speechSynthesis' in window) && !TTS_API_ENDPOINT) {
        alert('当前浏览器不支持语音朗读');
        return;
      }

      // 每次新朗读都重置为：优先 remote，有 endpoint 才启用
      activeTtsMode = TTS_API_ENDPOINT ? 'remote' : 'webspeech';

      const contentDiv = document.getElementById(`content-${articleId}`);
      if (!contentDiv) return;

      const spans = Array.from(contentDiv.querySelectorAll('.tts-sentence')).filter(s => s.textContent.trim().length > 0);
      if (!spans.length) return;

      window.speechSynthesis.cancel();
      ttsState.sessionToken += 1;
      ttsState.articleId = articleId;
      ttsState.sentences = spans;
      ttsState.currentIndex = Math.min(Math.max(startIndex, 0), spans.length - 1);
      ttsState.isPlaying = true;
      ttsState.isPaused = false;
      ttsState.bufferMap.clear();
      ttsState.inflightMap.clear();

      if (activeTtsMode === 'remote') {
        prefetchRemoteAhead(ttsState.currentIndex);
      }

      speakCurrentSentence();
      updateFloatingMenuVisibility();
    }

    function togglePlayPause() {
      if (expandedId === null) return;

      if (!ttsState.isPlaying) {
        startTTS(expandedId, 0);
        return;
      }

      if (activeTtsMode === 'remote') {
        if (!ttsState.audioEl) return;
        if (ttsState.isPaused) {
          ttsState.audioEl.play();
          ttsState.isPaused = false;
        } else {
          ttsState.audioEl.pause();
          ttsState.isPaused = true;
          clearSleepTimer();
        }
        updateFloatingMenuVisibility();
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (ttsState.isPaused) {
        window.speechSynthesis.resume();
        ttsState.isPaused = false;
      } else {
        window.speechSynthesis.pause();
        ttsState.isPaused = true;
        clearSleepTimer();
      }
      updateFloatingMenuVisibility();
    }

    function setupObserver() {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && page * pageSize < articles.length) {
          renderNextPage();
        }
      }, { rootMargin: '100px' });
      observer.observe(loader);
    }

    function setupFloatingMenuActions() {
      btnPlayPause.addEventListener('click', togglePlayPause);

      btnSleep.addEventListener('click', () => {
        sleepPanel.classList.toggle('show');
      });

      sleepPanel.querySelectorAll('.sleep-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = Number(btn.dataset.min || '0');
          if (m === 0) clearSleepTimer();
          else setSleepTimer(m);
          sleepPanel.classList.remove('show');
        });
      });

      btnShare.addEventListener('click', async () => {
        if (expandedId === null) return;
        const shareUrl = buildShareUrl(expandedId);
        try {
          if (navigator.share) {
            await navigator.share({ title: 'External Brain', url: shareUrl });
          } else {
            await navigator.clipboard.writeText(shareUrl);
            const old = btnShare.textContent;
            btnShare.textContent = '✅';
            setTimeout(() => { btnShare.textContent = old; }, 900);
          }
        } catch {
          // user canceled share or clipboard unavailable
        }
      });

      btnTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.addEventListener('click', (e) => {
        if (!sleepPanel.classList.contains('show')) return;
        if (sleepPanel.contains(e.target) || btnSleep.contains(e.target)) return;
        sleepPanel.classList.remove('show');
      });

      btnPrev.addEventListener('click', async () => {
        if (expandedId === null) return;
        const idx = getArticleIndexById(expandedId);
        if (idx <= 0) return;
        const targetIndex = idx - 1;
        await ensureRenderedByIndex(targetIndex);
        await openCard(articles[targetIndex].id);
      });

      btnNext.addEventListener('click', async () => {
        if (expandedId === null) return;
        const idx = getArticleIndexById(expandedId);
        if (idx >= articles.length - 1) return;
        const targetIndex = idx + 1;
        await ensureRenderedByIndex(targetIndex);
        await openCard(articles[targetIndex].id);
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');

        currentLang = e.target.dataset.lang;
        stopTTS();
        await updateUIToCurrentLang();
      });
    });

    async function updateUIToCurrentLang() {
      const cards = document.querySelectorAll('.card');
      for (let card of cards) {
        const id = parseInt(card.dataset.id);
        const article = articles.find(a => a.id === id);
        const data = article[currentLang];

        card.querySelector('.card-title').innerText = data.title || article['en'].title;
        card.querySelector('.card-summary').innerText = data.summary || article['en'].summary;

        if (expandedId === id) {
          const contentDiv = document.getElementById(`content-${id}`);
          contentDiv.dataset.loadedLang = '';
          await loadArticleContent(id);
        }
      }
      updateFloatingMenuVisibility();
    }

    window.speechSynthesis.onvoiceschanged = () => {};

    // 切换浏览器 tab 不停止播放；仅在真正离开页面时停止
    window.addEventListener('beforeunload', stopTTS);

    init();
  </script>
</body>
</html>
